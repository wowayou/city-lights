<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050918" />
    <meta name="description" content="万家灯火 City Lights — 转动电线，把每一户人家都点亮的解谜小游戏。每日一题，手机电脑都能玩。" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>万家灯火 · City Lights</title>
  </head>
  <body>
    <main id="app" data-screen="home">
      <canvas id="stage" role="img"></canvas>

      <header class="hud">
        <button type="button" class="icon-btn play-only" data-action="home">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5" /></svg>
        </button>
        <div class="hud-mid play-only">
          <p class="hud-title"></p>
          <p class="hud-stats"><span class="hud-time">0:00</span><span class="hud-sep"> · </span><span class="hud-moves"></span></p>
        </div>
        <button type="button" class="icon-btn" data-action="sound" aria-pressed="true">
          <svg class="icon-on" viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M4 9.5h3.2L12 5.4v13.2l-4.8-4.1H4z" /><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.6a7.6 7.6 0 0 1 0 10.8" /></svg>
          <svg class="icon-off" viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M4 9.5h3.2L12 5.4v13.2l-4.8-4.1H4z" /><path d="M15.5 9.5l5 5M20.5 9.5l-5 5" /></svg>
        </button>
      </header>

      <div class="playbar">
        <p class="hint" aria-hidden="true"></p>
        <nav class="tools">
          <button type="button" class="tool" data-action="undo">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7.5 5 11.5l4 4" /><path d="M5.5 11.5H14a5 5 0 0 1 0 10h-2" /></svg>
            <span class="undo-label"></span>
          </button>
          <button type="button" class="tool" data-action="hint">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.2 17.5h5.6M10 20.5h4" /><path d="M12 3.5a5.8 5.8 0 0 0-3.4 10.5c.6.5.9 1.1.9 1.8v.2h5v-.2c0-.7.3-1.3.9-1.8A5.8 5.8 0 0 0 12 3.5z" /></svg>
            <span class="hint-label"></span><i class="badge" hidden></i>
          </button>
          <button type="button" class="tool" data-action="reset">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 12a6.5 6.5 0 1 0 2-4.7" /><path d="M5 4.5v4h4" /></svg>
            <span class="reset-label"></span>
          </button>
        </nav>
      </div>

      <section class="screen home-screen">
        <h1 class="logo"></h1>
        <p class="logo-sub">CITY LIGHTS · 万家灯火</p>
        <p class="tagline"></p>
        <div class="menu">
          <button type="button" class="big-btn primary" data-action="daily"><b class="daily-label"></b><span class="daily-sub"></span></button>
          <button type="button" class="big-btn" data-action="levels"><b class="level-label"></b><span class="level-sub"></span></button>
          <button type="button" class="text-btn" data-action="level-select"></button>
        </div>
        <p class="howto"></p>
      </section>

      <section class="screen levels-screen">
        <div class="levels-panel">
          <div class="levels-head">
            <button type="button" class="icon-btn" data-action="home">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5" /></svg>
            </button>
            <h2 class="levels-title"></h2>
            <span class="levels-count"></span>
          </div>
          <div class="level-grid"></div>
        </div>
      </section>

      <section class="screen won-screen" role="status">
        <div class="card">
          <h2 class="won-title"></h2>
          <p class="won-sub"></p>
          <p class="won-lanterns" aria-hidden="true"></p>
          <dl class="stats">
            <div><dt class="time-label"></dt><dd class="won-time"></dd></div>
            <div><dt class="moves-label"></dt><dd class="won-moves"></dd></div>
            <div><dt class="par-label"></dt><dd class="won-par"></dd></div>
          </dl>
          <p class="won-extra"></p>
          <div class="actions">
            <button type="button" class="ghost-btn" data-action="replay-mine">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z" /></svg>
              <span class="replay-mine-label"></span>
            </button>
            <button type="button" class="ghost-btn" data-action="replay-ref">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3.5 6.5 13H12l-1 7.5L17.5 11H12z" /></svg>
              <span class="replay-ref-label"></span>
            </button>
            <button type="button" class="big-btn primary won-primary"></button>
            <button type="button" class="big-btn" data-action="home"><b class="home-label"></b></button>
          </div>
        </div>
      </section>

      <section class="screen replay-screen">
        <div class="player">
          <div class="player-head"><b class="player-title"></b><span class="player-step"></span></div>
          <input class="player-seek" type="range" min="0" max="1" step="1" value="0" />
          <div class="player-buttons">
            <button type="button" class="icon-btn" data-action="pb-restart">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 5.5v13" /><path class="fill" d="M18 6.2v11.6a.8.8 0 0 1-1.25.66L9 12.66a.8.8 0 0 1 0-1.32l7.75-5.8A.8.8 0 0 1 18 6.2z" /></svg>
            </button>
            <button type="button" class="icon-btn play-toggle" data-action="pb-toggle" aria-pressed="true">
              <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z" /></svg>
              <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><rect class="fill" x="6.5" y="5" width="3.6" height="14" rx="1.4" /><rect class="fill" x="13.9" y="5" width="3.6" height="14" rx="1.4" /></svg>
            </button>
            <button type="button" class="speed-btn" data-action="pb-speed">1×</button>
            <button type="button" class="big-btn close-btn" data-action="pb-close"><b class="close-label"></b></button>
          </div>
        </div>
      </section>

      <p class="toast" role="status" aria-live="polite"></p>
    </main>
    <noscript>万家灯火需要 JavaScript 才能运行。City Lights needs JavaScript.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
